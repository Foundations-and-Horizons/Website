<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Turn & Burn — Demo</title>
<style>
  /* ---- Design tokens (western leather-goods palette from the original app) ---- */
  :root{
    --cream:#F3EBDC;
    --charcoal:#2A211B;
    --leather:#5C3A21;
    --rust:#BE4B23;
    --gold:#D99A3D;
    --teal:#2E8B8B;
    --denim:#3D5A73;
    --money:#3E7C4F;
    --card:#E8D7B9;
    --page:#5CC3B6;
    --font-display:'Arial Narrow','Helvetica Neue Condensed',Impact,system-ui,sans-serif;
    --font-body:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* Commit to the warm cream world in either OS/viewer theme — this app is deliberately single-look. */
  body{
    background:linear-gradient(180deg,#6FD0C4 0%,#46B5A8 100%) fixed;
    color:var(--charcoal);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27104%27%20height%3D%27104%27%20viewBox%3D%270%200%20104%20104%27%3E%3Cg%20fill%3D%27%23FFF6E6%27%20fill-opacity%3D%270.11%27%3E%3Cg%20transform%3D%27translate%289%2C13%29%20scale%280.52%29%27%3E%3Cpolygon%20points%3D%2212%202%2015.09%208.26%2022%209.27%2017%2014.14%2018.18%2021.02%2012%2017.77%205.82%2021.02%207%2014.14%202%209.27%208.91%208.26%2012%202%22%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%2866%2C40%29%20scale%280.8%29%27%3E%3Cpolygon%20points%3D%2212%202%2015.09%208.26%2022%209.27%2017%2014.14%2018.18%2021.02%2012%2017.77%205.82%2021.02%207%2014.14%202%209.27%208.91%208.26%2012%202%22%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%2840%2C78%29%20scale%280.44%29%27%3E%3Cpolygon%20points%3D%2212%202%2015.09%208.26%2022%209.27%2017%2014.14%2018.18%2021.02%2012%2017.77%205.82%2021.02%207%2014.14%202%209.27%208.91%208.26%2012%202%22%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E");
    background-size:104px 104px;
  }
  #app{position:relative;z-index:1;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;}
  .font-display{font-family:var(--font-display);font-weight:800;letter-spacing:.01em;}
  .font-mono{font-family:var(--font-mono);}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px;}

  .wrap{max-width:680px;margin:0 auto;padding:16px;}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .gap2{gap:8px;} .gap3{gap:12px;} .gap4{gap:16px;}
  .grow{flex:1;}
  .wrapf{flex-wrap:wrap;}
  .hide-sm{display:none;}
  @media(min-width:640px){ .hide-sm{display:inline;} }

  /* ---- Top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;background:var(--charcoal);
    border-bottom:4px double var(--gold);
    box-shadow:0 4px 14px rgba(0,0,0,.22);
  }
  .brand{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:.03em;color:var(--cream);cursor:pointer;}
  .tabs{display:flex;gap:4px;}
  .tab{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:14px;font-weight:700;color:#C9BFAE;transition:background .15s,color .15s;}
  .tab.active{background:var(--rust);color:var(--cream);}

  /* ---- Stat pills ---- */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px;margin-top:-32px;position:relative;z-index:10;}
  @media(min-width:640px){ .stats{grid-template-columns:repeat(4,1fr);} }
  .pill{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--card);border:2px solid rgba(217,154,61,.2);border-radius:18px;padding:14px 10px;
    box-shadow:0 6px 18px rgba(42,33,27,.08);}
  .pill .num{font-family:var(--font-mono);font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1;}
  .pill .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--leather);margin-top:4px;text-align:center;}

  /* ---- Hero ---- */
  .hero{width:100%;padding:24px 20px 28px;background:var(--cream);text-align:center;border-bottom:2px solid rgba(92,58,33,.12);}
  .hero img{width:100%;max-width:420px;height:clamp(220px,34vh,340px);object-fit:contain;display:block;margin:0 auto 12px;}
  .hero .cap{max-width:560px;margin:0 auto;}
  .hero h1{font-family:var(--font-display);font-weight:800;font-size:52px;line-height:.92;color:var(--charcoal);margin:0;}
  .hero p{margin:12px auto 0;color:var(--leather);font-size:15px;max-width:34ch;}
  .hero .brand{margin-top:8px;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;}
  @media(min-width:640px){ .hero h1{font-size:64px;} }

  /* ---- Cards / generic ---- */
  .navgrid{display:grid;gap:12px;padding:24px 16px 40px;}
  @media(min-width:640px){ .navgrid{grid-template-columns:repeat(3,1fr);} }
  .navcard{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:18px;padding:16px;text-align:left;
    box-shadow:0 3px 10px rgba(42,33,27,.06);transition:box-shadow .15s,transform .15s;}
  .navcard:hover{box-shadow:0 10px 24px rgba(42,33,27,.14);transform:translateY(-2px);}
  .navcard .badge{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;}
  .navcard .t{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.05;}
  .navcard .s{font-size:12px;color:var(--leather);margin-top:2px;}

  .card{position:relative;background:var(--card);border:2px solid rgba(217,154,61,.2);border-radius:18px;padding:16px;box-shadow:0 3px 10px rgba(42,33,27,.08);}
  .card::after{content:"";position:absolute;inset:5px;border:2px dashed rgba(46,139,139,.6);border-radius:13px;pointer-events:none;}
  .list{display:flex;flex-direction:column;gap:12px;}
  .grid2{display:grid;gap:12px;}
  @media(min-width:640px){ .grid2{grid-template-columns:repeat(2,1fr);} }

  .title{font-family:var(--font-display);font-weight:800;font-size:26px;}
  .muted{color:var(--leather);}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .chip.denim{background:rgba(61,90,115,.14);color:var(--denim);}
  .chip.teal{background:rgba(46,139,139,.15);color:var(--teal);}
  .chip.gold{background:rgba(217,154,61,.22);color:#8A6520;}
  .chip.rustc{background:rgba(190,75,35,.14);color:var(--rust);}
  .chip.money{background:rgba(62,124,79,.16);color:var(--money);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;font-weight:700;font-size:14px;padding:9px 16px;color:#fff;transition:filter .15s;white-space:nowrap;flex:none;}
  .btn:hover{filter:brightness(1.06);}
  .btn.rust{background:var(--rust);} .btn.denim{background:var(--denim);} .btn.teal{background:var(--teal);}
  .btn-block{width:100%;padding:13px;border-radius:999px;font-weight:800;font-size:15px;color:#fff;}
  .icon-btn{padding:7px;border-radius:999px;background:var(--cream);display:inline-flex;}
  .selectlike{font-size:14px;border-radius:999px;padding:7px 13px;border:2px solid rgba(217,154,61,.35);background:#fff;color:var(--leather);}

  .empty{text-align:center;padding:64px 0;color:var(--leather);}
  .empty .title{margin-top:8px;}

  .time{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--rust);line-height:1;font-variant-numeric:tabular-nums;}
  .tny{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--leather);}

  /* ---- Modal ---- */
  .overlay{position:fixed;inset:0;z-index:30;background:rgba(42,33,27,.55);display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:640px){ .overlay{align-items:center;padding:16px;} }
  .sheet{width:100%;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;}
  @media(min-width:640px){ .sheet{max-width:520px;border-radius:20px;} }
  .sheet .head{position:sticky;top:0;background:var(--card);display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:2px solid rgba(217,154,61,.22);}
  .sheet .body{padding:20px;}
  .field{margin-bottom:16px;}
  .field > label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--leather);margin-bottom:6px;}
  .inp{width:100%;padding:10px 12px;border-radius:10px;border:2px solid rgba(217,154,61,.4);background:#fff;font-size:15px;color:var(--charcoal);}
  select.inp{appearance:auto;}
  textarea.inp{min-height:72px;resize:vertical;}
  .seg{display:flex;gap:8px;}
  .seg.tri{flex-wrap:wrap;}
  .seg button{flex:1;min-width:120px;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:12px;font-weight:700;font-size:14px;border:2px solid rgba(92,58,33,.25);background:#fff;color:var(--leather);}
  .seg.teal button.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .seg.denim button.on{background:var(--denim);color:#fff;border-color:var(--denim);}
  .seg.rust button.on{background:var(--rust);color:#fff;border-color:var(--rust);}
  .stars{display:flex;gap:4px;}
  .stars button{padding:2px;}
  .toggle{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:12px;font-weight:700;font-size:14px;border:2px solid rgba(61,90,115,.35);background:#fff;color:var(--leather);}
  .toggle.on{background:var(--denim);color:#fff;}
  .prefix{position:relative;}
  .prefix > span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--leather);font-weight:700;}
  .prefix > input{padding-left:26px;}
  .demo-tag{position:fixed;bottom:10px;right:10px;z-index:5;background:rgba(42,33,27,.82);color:var(--cream);font-size:11px;letter-spacing:.04em;padding:5px 10px;border-radius:999px;pointer-events:none;}
  .line2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .substay{display:flex;align-items:center;gap:8px;background:var(--cream);border-radius:12px;padding:8px 12px;}

  /* light-tan leather surface with a faint grain, layered on card-like panels */
  .card,.pill,.navcard,.sheet,.sheet .head{
    background-color:var(--card);
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27140%27%20height%3D%27140%27%3E%3Cfilter%20id%3D%27l%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20type%3D%27saturate%27%20values%3D%270%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27140%27%20height%3D%27140%27%20filter%3D%27url%28%23l%29%27%20opacity%3D%270.4%27%2F%3E%3C%2Fsvg%3E");
    background-blend-mode:soft-light;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="demo-tag">Turn & Burn Demo — saved on this device</div>

<script>
/* ============================================================
   Turn & Burn — self-contained demo
   Rebuilt from the original React artifact as plain HTML/CSS/JS
   so it runs with no build step and no internet connection.
   Data persists in this browser via localStorage.
   ============================================================ */

var HERO_IMG = "/rodeo/turn-and-burn-logo.png";

/* ---- Inline SVG icons (lucide-style) ---- */
var ICON_PATHS = {
  home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  timer:'<line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/>',
  mappin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  hotel:'<path d="M10 22v-6.57"/><path d="M12 11h.01"/><path d="M12 7h.01"/><path d="M14 15.43V22"/><path d="M15 16a5 5 0 0 0-6 0"/><path d="M16 11h.01"/><path d="M16 7h.01"/><path d="M8 11h.01"/><path d="M8 7h.01"/><rect x="4" y="2" width="16" height="20" rx="2"/>',
  tent:'<path d="M3.5 21 14 3"/><path d="M20.5 21 10 3"/><path d="M15.5 21 12 15l-3.5 6"/><path d="M2 21h20"/>',
  video:'<path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  accessibility:'<circle cx="16" cy="4" r="1"/><path d="m18 19 1-7-6 1"/><path d="m5 8 3-3 5.5 3-2.36 3.5"/><path d="M4.24 14.5a5 5 0 0 0 6.88 6"/><path d="M13.76 17.5a5 5 0 0 0-3.72-6.5"/>',
  chevron:'<path d="m9 18 6-6-6-6"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
  pencil:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>',
  sort:'<path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  building:'<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>',
  trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
  award:'<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>'
};
function icon(name,size,color,fill){
  size=size||18;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="'+(fill||'none')+'" stroke="'+(color||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICON_PATHS[name]+'</svg>';
}

/* ---- helpers ---- */
var seq=0;
function uid(){ return 'id'+Math.abs((Date.now()^(performance.now()*1000|0))).toString(36)+(seq++); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(sec){ if(sec===''||sec==null||isNaN(sec)) return '--'; return Number(sec).toFixed(2); }
function fmtMoney(n){ n=Number(n)||0; return '$'+n.toLocaleString(undefined,{maximumFractionDigits:0}); }
function fmtDate(d){ if(!d) return ''; var dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function catLabel(c){ return c==='college'?'College Rodeo':'Jackpot'; }
function catClass(c){ return c==='college'?'gold':'rustc'; }
function typeLabel(t){ return t==='indoor'?'Indoor':t==='outdoor'?'Outdoor':''; }

/* ---- storage ---- */
function load(key,fb){ try{ var v=localStorage.getItem(key); return v==null?fb:JSON.parse(v);}catch(e){return fb;} }
function save(key,v){ try{ localStorage.setItem(key,JSON.stringify(v)); }catch(e){} }

/* ---- seed sample data (v2: arena type, run category, winnings, stay↔arena) ---- */
(function seedData(){
  if(localStorage.getItem('turn-burn-seed-v1')) return;
  save('turn-burn-runs',[
    {id:'r1',date:'2026-06-27',event:'Cache Valley Summer Jackpot',arena:'Cache County Fairgrounds',category:'jackpot',time:'17.42',earnings:320,videoLink:'',notes:'Clean run, great first turn.'},
    {id:'r6',date:'2026-06-06',event:'Southern Utah University Rodeo',arena:'Golden Spike Arena',category:'college',time:'17.48',earnings:0,videoLink:'',notes:'Great indoor footing.'},
    {id:'r2',date:'2026-05-30',event:'Weber State College Rodeo',arena:'Golden Spike Arena',category:'college',time:'17.65',earnings:0,videoLink:'',notes:'First college rodeo of the split.'},
    {id:'r3',date:'2026-05-16',event:'Spring Sizzler Jackpot',arena:'Cache County Fairgrounds',category:'jackpot',time:'17.61',earnings:150,videoLink:'',notes:''},
    {id:'r4',date:'2026-04-25',event:'Utah State University Rodeo',arena:'Heber City Rodeo Grounds',category:'college',time:'18.05',earnings:0,videoLink:'',notes:'Deep ground, ran wide on purpose.'},
    {id:'r5',date:'2026-04-11',event:'Season Opener Jackpot',arena:'Heber City Rodeo Grounds',category:'jackpot',time:'17.95',earnings:75,videoLink:'',notes:'First run of the season.'}
  ]);
  save('turn-burn-travel',[
    {id:'t1',startDate:'2026-06-26',endDate:'2026-06-28',type:'hotel',name:'Best Western Logan Inn',arena:'Cache County Fairgrounds',ada:true,rating:4,notes:'Close to the fairgrounds, easy trailer parking.'},
    {id:'t2',startDate:'2026-05-29',endDate:'2026-05-31',type:'campground',name:'Golden Spike RV Park',arena:'Golden Spike Arena',ada:false,rating:3,notes:'Full hookups, a little dusty but fine for a weekend.'}
  ]);
  save('turn-burn-arena-info',{
    'Cache County Fairgrounds':{type:'outdoor',notes:'Ground stays firm. Good electronic timer. Warm-up pen is small — get there early.'},
    'Golden Spike Arena':{type:'indoor',notes:'Indoor, great footing. Can get loud, give her a minute to settle.'},
    'Heber City Rodeo Grounds':{type:'outdoor',notes:'Deep near barrel 3, take it a touch wider. Long score line.'}
  });
  localStorage.setItem('turn-burn-seed-v1','1');
})();

/* ---- state (with light migration/defaulting of older records) ---- */
function migrateArenaInfo(){
  var info=load('turn-burn-arena-info',null);
  if(info) return info;
  var oldNotes=load('turn-burn-arena-notes',{}), out={};
  Object.keys(oldNotes).forEach(function(k){ out[k]={type:'',notes:oldNotes[k]||''}; });
  return out;
}
var horses=load('turn-burn-horses',[{id:'h1',name:'Primary Horse',registeredName:'',notes:''}]);
var S = {
  view:'home',
  runs:load('turn-burn-runs',[]).map(function(r){ return Object.assign({horseId:'h1',drawNumber:'',entryFee:0,ground:'',barrelsDown:0,penaltySeconds:0,barrel1Notes:'',barrel2Notes:'',barrel3Notes:'',category:'jackpot',earnings:0,videoLink:'',notes:''},r); }),
  horses:horses,
  travel:load('turn-burn-travel',[]).map(function(t){ return Object.assign({arena:''},t); }),
  arenaInfo:migrateArenaInfo(),
  modal:null,
  form:null,
  runFilter:'all',
  runCat:'all',
  runSort:'date-desc'
};
function persist(){ save('turn-burn-runs',S.runs); save('turn-burn-travel',S.travel); save('turn-burn-arena-info',S.arenaInfo); save('turn-burn-horses',S.horses); }
function horseName(id){ var h=(S.horses||[]).find(function(x){return x.id===id;}); return h?h.name:'Horse'; }
function arenas(){
  var set={}; S.runs.forEach(function(r){ if(r.arena) set[r.arena]=1; });
  Object.keys(S.arenaInfo).forEach(function(a){ set[a]=1; });
  return Object.keys(set).sort();
}
function arenaType(name){ return (S.arenaInfo[name]&&S.arenaInfo[name].type)||''; }
function arenaNotesOf(name){ return (S.arenaInfo[name]&&S.arenaInfo[name].notes)||''; }
function bestByType(type){
  var t=S.runs.filter(function(r){return arenaType(r.arena)===type;}).map(function(r){return Number(r.time);}).filter(function(n){return !isNaN(n)&&n>0;});
  return t.length?Math.min.apply(null,t):null;
}
function totalWon(){ return S.runs.reduce(function(s,r){return s+(Number(r.earnings)||0);},0); }
function staysForArena(name){ return S.travel.filter(function(t){return t.arena===name;}); }

/* ---- shared bits ---- */

    }).join('')+'</div></div>';
}
function typeChip(type){
  if(type==='outdoor') return '<span class="chip teal">'+icon('sun',11,'var(--teal)')+'Outdoor</span>';
  if(type==='indoor') return '<span class="chip denim">'+icon('building',11,'var(--denim)')+'Indoor</span>';

}

/* ---- RUNS ---- */
function viewRuns(){
  var list=S.runs.filter(function(r){return S.runFilter==='all'||r.arena===S.runFilter;})
    .filter(function(r){return S.runCat==='all'||r.category===S.runCat;})
    .sort(function(a,b){

      if(S.runSort==='date-asc') return (a.date||'').localeCompare(b.date||'');

    });
  var sortLbl=S.runSort==='date-desc'?'Newest':S.runSort==='date-asc'?'Oldest':'Fastest';
  var arenaOpts='<option value="all">All arenas</option>'+arenas().map(function(a){
    return '<option value="'+esc(a)+'"'+(S.runFilter===a?' selected':'')+'>'+esc(a)+'</option>';}).join('');
  var catOpts=[['all','All types'],['jackpot','Jackpots'],['college','College rodeo']].map(function(o){
    return '<option value="'+o[0]+'"'+(S.runCat===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('');
  var body=topbar('runs')+'<div class="wrap">'+
    '<div class="row between gap2 wrapf" style="margin-bottom:12px;">'+

        '<select class="selectlike" data-runfilter style="min-width:0;">'+arenaOpts+'</select>'+
        '<button class="selectlike row gap2" data-runsort style="white-space:nowrap;flex:none;">'+icon('sort',13,'var(--leather)')+sortLbl+'</button>'+
      '</div>'+
      '<button class="btn rust" data-newrun>'+icon('plus',16,'#fff')+'Log run</button>'+
    '</div>';
  if(list.length===0){
    body+='<div class="empty">'+icon('timer',32,'var(--leather)')+'<div class="title">No runs to show</div><div>Tap &ldquo;Log run&rdquo; to add one.</div></div>';
  }
  body+='<div class="list">'+list.map(function(r){
    var money=Number(r.earnings)>0?'<span class="chip money">'+icon('trophy',11,'var(--money)')+'Won '+fmtMoney(r.earnings)+'</span>':'';
    var horse='<span class="chip gold">'+icon('horse',11,'var(--leather)')+esc(horseName(r.horseId))+'</span>';
    var draw=r.drawNumber?'<span class="chip">Draw #'+esc(r.drawNumber)+'</span>':'';
    var barrels=Number(r.barrelsDown)||0, penalty=Number(r.penaltySeconds)||0;
    var runStatus=(barrels===0&&penalty===0)
      ?'<span class="chip teal">Clean run</span>'
      :'<span class="chip rust">'+(barrels?barrels+' barrel'+(barrels===1?'':'s')+' down':'Penalty')+(penalty?' · +'+penalty+'s':'')+'</span>';
    var ground=r.ground?'<span class="chip denim">'+esc(r.ground)+'</span>':'';
    var net=(Number(r.earnings)||0)-(Number(r.entryFee)||0);
    var netLine=(Number(r.entryFee)||0)>0?'<div class="tny" style="margin-top:3px;">Net '+fmtMoney(net)+'</div>':'';
    return '<div class="card">'+
      '<div class="row between" style="align-items:flex-start;">'+
        '<div style="padding-right:8px;min-width:0;"><div class="font-display" style="font-size:20px;font-weight:800;line-height:1.05;">'+esc(r.event)+'</div>'+
          '<div class="muted" style="font-size:12px;margin-top:2px;">'+esc(fmtDate(r.date))+'</div>'+
          '<div class="chips">'+horse+draw+
            '<span class="chip '+catClass(r.category)+'">'+catLabel(r.category)+'</span>'+
            '<span class="chip denim">'+icon('mappin',11,'var(--denim)')+esc(r.arena)+'</span>'+
            runStatus+ground+money+
          '</div></div>'+
        '<div style="text-align:right;flex:none;"><div class="time">'+fmtTime(r.time)+'</div><div class="tny">seconds</div>'+netLine+'</div>'+
      '</div>'+
      (r.notes?'<div style="font-size:14px;margin-top:10px;">'+esc(r.notes)+'</div>':'')+
      '<div class="row between" style="margin-top:12px;">'+
        (r.videoLink?'<a class="chip teal" href="'+esc(r.videoLink)+'" target="_blank" rel="noreferrer">'+icon('video',12,'var(--teal)')+'Watch run</a>':'<span></span>')+
        '<div class="row gap2">'+
          '<button class="icon-btn" data-editrun="'+r.id+'" aria-label="Edit run">'+icon('pencil',14,'var(--leather)')+'</button>'+
          '<button class="icon-btn" data-delrun="'+r.id+'" aria-label="Delete run">'+icon('trash',14,'var(--rust)')+'</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('')+'</div></div>';
  return body;
}

/* ---- ARENAS ---- */
function viewArenas(){

  });
  var body=topbar('arenas')+'<div class="wrap">'+

      '</div>'+
      field('Rating','<div class="stars">'+stars+'</div>')+
      field('ADA accessible room','<button class="toggle '+(f.ada?'on':'')+'" data-ada>'+icon('accessibility',16)+(f.ada?'Yes':'No')+'</button>')+
      field('Notes','<textarea class="inp" data-f="notes" placeholder="Pet-friendly, close to arena, noisy AC...">'+esc(f.notes)+'</textarea>')+
      '<button class="btn-block" style="background:var(--teal)" data-savestay>Save stay</button>');
  }
  return '';
}

/* ---- render ---- */
function render(){
  var v = S.view==='runs'?viewRuns():S.view==='arenas'?viewArenas():S.view==='travel'?viewTravel():viewHome();
  document.getElementById('app').innerHTML = v + renderModal();
}

/* ---- events ---- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-nav],[data-newrun],[data-editrun],[data-delrun],[data-runsort],[data-newarena],[data-arena],[data-newstay],[data-editstay],[data-delstay],[data-closemodal],[data-overlay],[data-saverun],[data-savenote],[data-savearena],[data-savestay],[data-type],[data-cat],[data-atype],[data-star],[data-ada],[data-gotostay]');
  if(!t) return;

  if(t.hasAttribute('data-nav')){ S.view=t.getAttribute('data-nav'); S.modal=null; render(); return; }

  // runs
  if(t.hasAttribute('data-newrun')){ S.form={id:uid(),date:'',event:'',arena:'',arenaType:'outdoor',horseId:(S.horses[0]&&S.horses[0].id)||'',drawNumber:'',category:'jackpot',time:'',entryFee:'',earnings:'',ground:'',barrelsDown:0,penaltySeconds:'',barrel1Notes:'',barrel2Notes:'',barrel3Notes:'',videoLink:'',notes:''}; S.modal={kind:'run',editing:false}; render(); return; }
  if(t.hasAttribute('data-editrun')){ var r=S.runs.find(function(x){return x.id===t.getAttribute('data-editrun');}); S.form=Object.assign({arenaType:arenaType(r.arena)||'outdoor'},r); S.modal={kind:'run',editing:true}; render(); return; }
  if(t.hasAttribute('data-delrun')){ S.runs=S.runs.filter(function(x){return x.id!==t.getAttribute('data-delrun');}); persist(); render(); return; }
  if(t.hasAttribute('data-runsort')){ S.runSort=S.runSort==='date-desc'?'date-asc':S.runSort==='date-asc'?'time-asc':'date-desc'; render(); return; }
  if(t.hasAttribute('data-cat')){ S.form.category=t.getAttribute('data-cat'); render(); return; }
  if(t.hasAttribute('data-saverun')){
    var f=S.form; if(!f.event||!f.arena) return;
    var run={id:f.id,date:f.date,event:f.event,arena:f.arena,horseId:f.horseId||'',drawNumber:f.drawNumber||'',category:f.category,time:f.time,entryFee:Number(f.entryFee)||0,earnings:Number(f.earnings)||0,ground:f.ground||'',barrelsDown:Number(f.barrelsDown)||0,penaltySeconds:Number(f.penaltySeconds)||0,barrel1Notes:f.barrel1Notes||'',barrel2Notes:f.barrel2Notes||'',barrel3Notes:f.barrel3Notes||'',videoLink:f.videoLink||'',notes:f.notes||''};
    var ex=S.runs.some(function(x){return x.id===run.id;});
    S.runs = ex? S.runs.map(function(x){return x.id===run.id?run:x;}) : S.runs.concat([run]);
    // remember the arena's indoor/outdoor type
    var cur=S.arenaInfo[f.arena]||{type:'',notes:''};
    if(f.arenaType) cur.type=f.arenaType;
    S.arenaInfo[f.arena]=cur;
    persist(); S.modal=null; render(); return;
  }

  // arenas
  if(t.hasAttribute('data-newarena')){ S.form={name:'',type:'outdoor'}; S.modal={kind:'arenaNew'}; render(); return; }
  if(t.hasAttribute('data-arena')){ var nm=t.getAttribute('data-arena'); S.form={note:arenaNotesOf(nm),type:arenaType(nm)}; S.modal={kind:'arenaDetail',name:nm}; render(); return; }
  if(t.hasAttribute('data-savenote')){ S.arenaInfo[S.modal.name]={type:S.form.type||'',notes:S.form.note||''}; persist(); S.modal=null; render(); return; }
  if(t.hasAttribute('data-savearena')){ var n=(S.form.name||'').trim(); if(!n) return; S.arenaInfo[n]={type:S.form.type||'',notes:arenaNotesOf(n)}; persist(); S.modal=null; render(); return; }
  if(t.hasAttribute('data-gotostay')){ S.modal=null; S.view='turn-burn-travel'; render(); return; }

  // travel
  if(t.hasAttribute('data-newstay')){ S.form={id:uid(),startDate:'',endDate:'',type:'hotel',name:'',arena:'',ada:false,rating:0,notes:''}; S.modal={kind:'turn-burn-travel',editing:false}; render(); return; }
  if(t.hasAttribute('data-editstay')){ var s=S.travel.find(function(x){return x.id===t.getAttribute('data-editstay');}); S.form=Object.assign({arena:''},s); S.modal={kind:'turn-burn-travel',editing:true}; render(); return; }
  if(t.hasAttribute('data-delstay')){ S.travel=S.travel.filter(function(x){return x.id!==t.getAttribute('data-delstay');}); persist(); render(); return; }
  if(t.hasAttribute('data-type')){ S.form.type=t.getAttribute('data-type'); render(); return; }
  if(t.hasAttribute('data-atype')){ S.form.arenaType=t.getAttribute('data-atype'); S.form.type=t.getAttribute('data-atype'); render(); return; }
  if(t.hasAttribute('data-star')){ S.form.rating=Number(t.getAttribute('data-star')); render(); return; }
  if(t.hasAttribute('data-ada')){ S.form.ada=!S.form.ada; render(); return; }
  if(t.hasAttribute('data-savestay')){
    var ff=S.form; if(!ff.name) return;
    var e2=S.travel.some(function(x){return x.id===ff.id;});
    S.travel = e2? S.travel.map(function(x){return x.id===ff.id?ff:x;}) : S.travel.concat([ff]);
    persist(); S.modal=null; render(); return;
  }

  // modal close
  if(t.hasAttribute('data-closemodal')||t.hasAttribute('data-overlay')){ S.modal=null; render(); return; }
});

// text inputs / selects update the working form without a full re-render (keeps focus)
function syncField(e){
  var el=e.target.closest('[data-f]'); if(!el||!S.form) return;
  S.form[el.getAttribute('data-f')]=el.value;
}
document.addEventListener('input',syncField);
document.addEventListener('change',function(e){
  var cf=e.target.closest('[data-catfilter]'); if(cf){ S.runCat=cf.value; render(); return; }
  var af=e.target.closest('[data-runfilter]'); if(af){ S.runFilter=af.value; render(); return; }
  syncField(e);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.modal){ S.modal=null; render(); }
});

render();
</script>
</body>
</html>
